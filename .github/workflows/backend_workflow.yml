name: Backend CI

on:
  push:
    branches: [ "master" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend_workflow.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend_workflow.yml"

# Least privilege: the build only reads the repo.
permissions:
  contents: read

# Superseded runs (a PR push while CI is queued) cancel instead of burning
# runners — the improvement loop pushes repeatedly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  directory-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test directory-service
        working-directory: backend
        run: ./gradlew :directory-service:clean :directory-service:build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-directory-service-test-reports
          path: |
            backend/directory-service/build/test-results/test/*.xml
            backend/directory-service/build/reports/tests/test/**/*
          retention-days: 7

  product-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test product-service
        working-directory: backend
        run: ./gradlew :product-service:clean :product-service:build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-product-service-test-reports
          path: |
            backend/product-service/build/test-results/test/*.xml
            backend/product-service/build/reports/tests/test/**/*
          retention-days: 7
