name: Backend CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Least privilege: the build only reads the repo.
permissions:
  contents: read

# Superseded runs (a PR push while CI is queued) cancel instead of burning
# runners — the improvement loop pushes repeatedly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test with Gradle
        working-directory: backend
        run: ./gradlew clean build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/*/build/test-results/test/*.xml
            backend/*/build/reports/tests/test/**/*
          retention-days: 7
