name: Loop Watchdog

# Cloud-side dead-man's switch for the laptop-run improvement loop: the loop's
# own logs never leave the machine and its exits read as success, so a stall
# (like the ~10h pile-guard deadlock on PR #193) is invisible without this.
# All logic lives in scripts/loop-watchdog-check.sh (unit-tested); this file
# is only schedule + permissions.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Least privilege: read PRs, write issues (alerts only).
permissions:
  contents: read
  pull-requests: read
  issues: write

# No cancellation: a 5-minute check on a 6-hour cadence never self-overlaps,
# and a schedule firing mid-manual-dispatch must not eat the debug run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for loop activity in the last 24h
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/loop-watchdog-check.sh
