name: Frontend CI

on:
  push:
    branches: [ "master" ]
    paths:
      - "frontend/**"
      - ".dockerignore"
      - "backend/product-service/**"
      - ".github/workflows/frontend_workflow.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "frontend/**"
      - ".dockerignore"
      - "backend/product-service/**"
      - ".github/workflows/frontend_workflow.yml"

# Least privilege: the build only reads the repo.
permissions:
  contents: read

# Superseded runs cancel instead of burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [ 24 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js ${{ matrix.node-version }} and Cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/natiart-app/package-lock.json

      - name: Install Dependencies and Build
        working-directory: frontend/natiart-app
        run: |
          npm ci
          npm run build -- --configuration production
          node scripts/verify-production-artifacts.mjs
          node --test scripts/verify-production-artifacts.test.mjs

      - name: Unit tests (Karma, ChromeHeadless)
        working-directory: frontend/natiart-app
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build the production frontend container
        run: docker build -t natiart-frontend-ci frontend

      - name: Set up Java 25 for the real metadata HTTP boundary
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: 'corretto'
          java-version: '25'
      - name: Build product application and fetch real public metadata through nginx
        run: |
          ./gradlew :backend:product-service:bootJar
          python3 frontend/scripts/product_metadata_smoke.py
          python3 frontend/tests/container_rollout_test.py

  docker-context-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify clean and dirty Docker contexts and lockfile strictness
        run: bash frontend/scripts/smoke_contexts.sh
