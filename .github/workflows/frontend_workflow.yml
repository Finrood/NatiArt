name: Frontend CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Least privilege: the build only reads the repo.
permissions:
  contents: read

# Superseded runs cancel instead of burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [ 20 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }} and Cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/natiart-app/package-lock.json

      - name: Install Dependencies and Build
        working-directory: frontend/natiart-app
        run: |
          npm ci
          npm run build

      - name: Unit tests (Karma, ChromeHeadless)
        working-directory: frontend/natiart-app
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless
