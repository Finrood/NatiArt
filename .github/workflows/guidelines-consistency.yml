name: Guidelines Consistency

on:
  push:
    branches: [ "master" ]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursorrules"
      - "agents/**"
      - "backend/AGENTS.md"
      - "frontend/natiart-app/AGENTS.md"
      - "docs/**"
      - "scripts/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/guidelines-consistency.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursorrules"
      - "agents/**"
      - "backend/AGENTS.md"
      - "frontend/natiart-app/AGENTS.md"
      - "docs/**"
      - "scripts/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/guidelines-consistency.yml"

# Least privilege: the check only reads the repo.
permissions:
  contents: read

# Superseded runs cancel instead of burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guidelines:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Root instruction mirrors must be identical
        run: |
          cmp AGENTS.md CLAUDE.md || { echo "CLAUDE.md drifted from AGENTS.md"; exit 1; }
          cmp AGENTS.md GEMINI.md || { echo "GEMINI.md drifted from AGENTS.md"; exit 1; }
          cmp AGENTS.md .cursorrules || { echo ".cursorrules drifted from AGENTS.md"; exit 1; }
          echo "Mirrors identical."

      - name: agents/*.md must carry YAML frontmatter with meta
        run: |
          fail=0
          for f in agents/*.md; do
            head -1 "$f" | grep -q '^---$' || { echo "$f: missing YAML frontmatter"; fail=1; }
            head -5 "$f" | grep -q '^meta:' || { echo "$f: missing meta attribute"; fail=1; }
          done
          exit $fail

      - name: Convention bans (zero-tolerance, see agents/*.md)
        run: |
          fail=0
          report() { # $1 = rule, $2 = matches (empty means clean)
            if [ -n "$2" ]; then echo "BANNED ($1):"; echo "$2" | head -5; fail=1; fi
          }
          report "Lombok (java-general.md)" "$(grep -rln 'lombok' backend/*/src 2>/dev/null || true)"
          report "MapStruct (java-general.md)" "$(grep -rln 'mapstruct' backend/*/src 2>/dev/null || true)"
          report "legacy *ngIf/*ngFor (frontend AGENTS.md)" "$(grep -rn '\*ngIf\|\*ngFor' frontend/natiart-app/src --include='*.html' 2>/dev/null | grep -v '<!--' || true)"
          report "legacy *ngIf/*ngFor in TS (frontend AGENTS.md)" "$(grep -rn '\*ngIf\|\*ngFor' frontend/natiart-app/src --include='*.ts' 2>/dev/null | grep -v '//' || true)"
          report "lodash (frontend AGENTS.md)" "$(grep -rln "from ['\"]lodash['\"]" frontend/natiart-app/src 2>/dev/null || true)"
          report "console.log in prod code (review hygiene)" "$(grep -rn 'console\.log' frontend/natiart-app/src --include='*.ts' 2>/dev/null | grep -v '\.spec\.ts' || true)"
          report "@ResponseStatus on exceptions (backend AGENTS.md)" "$(grep -rn '@ResponseStatus' backend/*/src/main 2>/dev/null || true)"
          [ "$fail" -eq 0 ] && echo "All convention bans clean."
          exit $fail
