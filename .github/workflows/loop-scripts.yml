name: Loop Scripts

on:
  push:
    branches: [ "master" ]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"

# Least privilege: the checks only read the repo.
permissions:
  contents: read

# Superseded runs cancel instead of burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Shellcheck loop scripts
        run: |
          shopt -s nullglob
          shellcheck -S warning scripts/*.sh scripts/tests/*.sh

  bash-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Bash syntax check
        run: |
          shopt -s nullglob
          for f in scripts/*.sh scripts/tests/*.sh; do bash -n "$f"; done

      - name: Loop helper tests (offline, stubbed gh)
        run: bash scripts/tests/run.sh
