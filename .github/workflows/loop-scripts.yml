name: Loop Scripts

on:
  push:
    branches: [ "master" ]
    paths:
      - "scripts/**"
      - ".github/workflows/loop-scripts.yml"
      - ".github/workflows/loop-watchdog.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "scripts/**"
      - ".github/workflows/loop-scripts.yml"
      - ".github/workflows/loop-watchdog.yml"

# Least privilege: the checks only read the repo.
permissions:
  contents: read

# Superseded runs cancel instead of burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Shellcheck loop scripts
        run: shellcheck -S warning scripts/*.sh scripts/tests/*.sh

  bash-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Bash syntax check
        run: bash -n scripts/loop-cycle.sh && bash -n scripts/run-agent.sh && bash -n scripts/loop-lib.sh

      - name: Loop helper tests (offline, stubbed gh)
        run: bash scripts/tests/run.sh
