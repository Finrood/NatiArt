server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ready\n";
    }

    location /server/directory/ {
        proxy_pass ${DIRECTORY_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto ${NATIART_PUBLIC_SCHEME};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /server/product/ {
        proxy_pass ${PRODUCT_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto ${NATIART_PUBLIC_SCHEME};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /server/directory { return 308 /server/directory/; }
    location = /server/product { return 308 /server/product/; }
    location /server/ { return 404; }

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Only content-hashed build files receive immutable caching and retention.
    location ~ "^/(?:[a-zA-Z0-9_-]+/)*[a-zA-Z0-9_-]+-[a-zA-Z0-9]{8,}\.(?:js|css|woff2?|png|jpe?g|webp|svg|ico)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @retained_asset;
    }

    location @retained_asset {
        root /var/lib/natiart-assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|map|woff2?|png|jpe?g|webp|svg|ico|html)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
