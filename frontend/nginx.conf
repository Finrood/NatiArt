server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A bounded anonymous scalar read supplies metadata before any JavaScript runs.
    location ~ "^/(?<shop_language>en|pt-BR)/product/(?<product_id>[A-Za-z0-9-]{1,64})/?$" {
        auth_request /_public-product-metadata;
        auth_request_set $public_title $upstream_http_x_natiart_title;
        auth_request_set $public_description $upstream_http_x_natiart_description;
        auth_request_set $public_language $upstream_http_x_natiart_language;
        auth_request_set $public_type $upstream_http_x_natiart_type;
        add_header Cache-Control "no-store" always;
        sub_filter_once on;
        sub_filter '<title>NatiArt | Handmade Art</title>' '<title>$public_title</title>';
        sub_filter '<meta name="description" content="Browse products from NatiArt.">' '<meta name="description" content="$public_description">';
        sub_filter '<meta name="natiart-public-metadata">' '<meta property="og:title" content="$public_title"><meta property="og:description" content="$public_description"><meta property="og:type" content="$public_type">';
        sub_filter '<meta name="content-language" content="en">' '<meta name="content-language" content="$public_language">';
        sub_filter '<title>NatiArt | Arte artesanal</title>' '<title>$public_title</title>';
        sub_filter '<meta name="description" content="Conheça os produtos da NatiArt.">' '<meta name="description" content="$public_description">';
        try_files /$shop_language/index.html =404;
    }

    location = /_public-product-metadata {
        internal;
        proxy_pass ${PRODUCT_UPSTREAM}/products/$product_id/metadata?language=$shop_language;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location = /healthz {
        access_log off;
        return 200 "ready\n";
    }

    location /server/directory/ {
        proxy_pass ${DIRECTORY_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto ${NATIART_PUBLIC_SCHEME};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /server/product/ {
        proxy_pass ${PRODUCT_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto ${NATIART_PUBLIC_SCHEME};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /server/directory { return 308 /server/directory/; }
    location = /server/product { return 308 /server/product/; }
    location /server/ { return 404; }

    location ~ "^/(?:en|pt-BR)/index\.html$" {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html { return 308 /en/$is_args$args; }

    # Only content-hashed build files receive immutable caching and retention.
    location ~ "^/(?:[a-zA-Z0-9_-]+/)*[a-zA-Z0-9_-]+-[a-zA-Z0-9]{8,}\.(?:js|css|woff2?|png|jpe?g|webp|svg|ico)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @retained_asset;
    }

    location @retained_asset {
        root /var/lib/natiart-assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|map|woff2?|png|jpe?g|webp|svg|ico|html)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /en/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /en/index.html;
    }

    location /pt-BR/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /pt-BR/index.html;
    }

    location = /en { return 308 /en/$is_args$args; }
    location = /pt-BR { return 308 /pt-BR/$is_args$args; }

    # Preserve legacy bookmarks and query parameters with English as the default.
    location / { return 308 /en$request_uri; }
}
