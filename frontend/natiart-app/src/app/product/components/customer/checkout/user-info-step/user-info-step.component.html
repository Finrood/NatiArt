<div [formGroup]="userInfoGroup" class="space-y-4">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <app-natiart-form-field label="First Name" controlName="firstname" [form]="userInfoGroup" i18n-label>
      <input formControlName="firstname" id="firstname" type="text" autocomplete="given-name" placeholder="John" maxlength="255" class="form-input" i18n-placeholder>
    </app-natiart-form-field>

    <app-natiart-form-field label="Last Name" controlName="lastname" [form]="userInfoGroup" i18n-label>
      <input formControlName="lastname" id="lastname" type="text" autocomplete="family-name" placeholder="Doe" maxlength="255" class="form-input" i18n-placeholder>
    </app-natiart-form-field>
  </div>

  <app-natiart-form-field label="Email Address" controlName="email" [form]="userInfoGroup" i18n-label>
    <input formControlName="email" id="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="255" class="form-input" i18n-placeholder>
  </app-natiart-form-field>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <app-natiart-form-field label="CPF" controlName="cpf" [form]="userInfoGroup" i18n-label>
      <input formControlName="cpf" id="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" cpfFormat class="form-input">
    </app-natiart-form-field>

    <app-natiart-form-field label="Phone (Optional)" controlName="phone" [form]="userInfoGroup" [isOptional]="true" i18n-label>
      <input formControlName="phone" id="phone" type="tel" autocomplete="tel-national" placeholder="(XX) XXXXX-XXXX" appPhoneFormatBrazil maxlength="255" class="form-input" i18n-placeholder>
    </app-natiart-form-field>
  </div>
</div>
