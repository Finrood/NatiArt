<section class="py-12 bg-background">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <h2 class="text-3xl md:text-4xl font-serif font-light text-secondary text-center mb-10">{{ title }}</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
      <!-- Track stable ids; id-less cards fall back to object identity (no duplicate-key throw). -->
      @for (product of products | async; track (product.id ?? product)) {
        <app-product-card [product]="product" [imageUrl]="imageUrls[product.id ?? 'card-' + $index] || emptyImage"
          [imageLoading]="images.states()[product.id ?? 'card-' + $index] === 'loading'"
          [quickAdd]="true" (imageFailed)="images.failed(product.id ?? 'card-' + $index)"
          (itemAdded)="triggerFlyAnimation($event)"></app-product-card>
      }
    </div>
  </div>
</section>

<app-personalization-modal (close)="closePersonalizationModal()" (personalize)="onPersonalizationComplete($event)" [product]="selectedProduct" [show]="showPersonalizationModal"></app-personalization-modal>
