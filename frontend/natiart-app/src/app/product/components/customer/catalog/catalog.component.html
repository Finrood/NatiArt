
<div class="flex flex-col lg:flex-row">
  <app-left-menu [selectedCategoryId]="$categoryId()"></app-left-menu>
  <main class="flex-1 min-w-0 p-4 sm:p-6">
    <h1 class="text-3xl mb-6" i18n>Collections</h1>
    <form (ngSubmit)="searchProducts()" class="flex flex-wrap gap-3 mb-6">
      <label for="catalog-search" class="sr-only" i18n>Search products</label>
      <input id="catalog-search" name="search" [(ngModel)]="search" maxlength="200" placeholder="Search products" i18n-placeholder
        class="form-input flex-1 min-w-0 basis-40" />
      <app-button type="submit" color="primary" size="sm" i18n>Search</app-button>
    </form>
    @if (pages.$loading()) { <p role="status" i18n>Loading products...</p> }
    @else if (!pages.$error() && $items().length === 0) { <p i18n>No products match this selection.</p> }
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6">
      @for (product of $items(); track product.id) {
        <app-product-card [product]="product" [imageUrl]="product.images[0] ? imageUrl(product.images[0]) : emptyImage"></app-product-card>
      }
    </div>
    <app-page-controls [page]="pages.$page()" [total]="pages.$total()" [hasNext]="pages.$hasNext()"
      [loading]="pages.$loading()" [error]="pages.$error()" (pageChange)="changePage($event)"></app-page-controls>
  </main>
</div>
