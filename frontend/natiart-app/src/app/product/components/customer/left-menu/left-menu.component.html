<aside class="w-full lg:w-56 bg-background text-secondary border-b lg:border-0 border-primary-light/40">
  <div class="px-4 py-3 lg:px-6 lg:py-6">
    <span class="hidden lg:block text-lg font-semibold font-serif" i18n>Categories</span>
    <button type="button" aria-controls="category-filters" [attr.aria-expanded]="$filtersOpen()"
      (click)="toggleMenu()" class="lg:hidden rounded-md border border-primary px-4 py-2 text-primary font-medium" i18n>Filters</button>
    @if ($selectedCategoryId()) {
      <a routerLink="/products" [queryParams]="{categoryId: null, page: 0}" queryParamsHandling="merge"
        aria-label="Clear category filter" i18n-aria-label
        class="mt-3 flex items-center justify-between gap-3 rounded-full bg-primary-lighter px-4 py-2 text-sm">
        <span class="min-w-0 break-words">{{ $selectedCategoryLabel() }}</span>
        <span aria-hidden="true">×</span>
      </a>
    }
  </div>
  <nav id="category-filters" [class.hidden]="!$filtersOpen()" class="lg:block pb-4" aria-label="Product categories" i18n-aria-label>
    <ul>
      <li>
        <a aria-label="All products" routerLink="/products" [queryParams]="{page: 0}"
          (click)="$filtersOpen.set(false)" [attr.aria-current]="!$selectedCategoryId() ? 'page' : null" class="block py-3 px-6 text-sm hover:bg-primary-lighter/50 hover:text-primary-dark" i18n>All Products</a>
      </li>
      @if (pages.$error()) {
        <li class="px-6 py-3 text-sm" role="status" i18n>Categories are temporarily unavailable.</li>
      }
      @for (category of $categories(); track category.id) {
        <li>
          <a [attr.aria-label]="category.label" routerLink="/products" [queryParams]="{categoryId: category.id, page: 0}"
            (click)="$filtersOpen.set(false)" [attr.aria-current]="$selectedCategoryId() === category.id ? 'page' : null" class="block py-3 px-6 text-sm break-words hover:bg-primary-lighter/50 hover:text-primary-dark">{{ category.label }}</a>
        </li>
      }
    </ul>
    <app-page-controls [page]="pages.$page()" [total]="pages.$total()" [hasNext]="pages.$hasNext()"
      [loading]="pages.$loading()" [error]="pages.$error()" (pageChange)="pages.load($event)"></app-page-controls>
  </nav>
</aside>
