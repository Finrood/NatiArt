<div class="bg-background min-h-screen font-sans text-secondary-dark">
  <a [href]="skipContentHref" (click)="skipToContent($event)" class="skip-link" i18n>Skip to content</a>
  <app-top-menu class="sticky top-0 z-50 block"></app-top-menu>
  <div id="store-content" tabindex="-1" class="min-h-[calc(100svh-5.5rem)]">
    @if ($navigationError()) {
      <section data-navigation-error tabindex="-1" role="alert" class="art-page">
        <div class="art-panel p-6 border-error/40">
          <h2 class="text-2xl mb-3" i18n>We could not open that page.</h2>
          <p class="text-sm mb-3" i18n>The shop may have been updated, or your connection was interrupted. Try the link again or reload this page.</p>
          <p class="text-sm text-text-muted mb-5" i18n>After reloading, select any uploaded artwork again.</p>
          <button type="button" class="art-action" (click)="reloadPage()" i18n>Reload page</button>
        </div>
      </section>
    }
    <router-outlet></router-outlet>
  </div>
  <app-footer></app-footer>
</div>
