<div class="space-y-4" [formGroup]="credentialForm">
  <app-natiart-form-field label="Email Address" controlName="username" [form]="credentialForm" i18n-label>
    <input id="username" type="email" formControlName="username" autocomplete="email" placeholder="you@example.com" i18n-placeholder class="form-input">
  </app-natiart-form-field>

  <app-natiart-form-field label="Password" [isPassword]="true" controlName="password" [form]="credentialForm" i18n-label>
    <input id="password" type="password" formControlName="password" autocomplete="new-password" placeholder="••••••••" class="form-input">
    <app-password-requirements field-hint [password]="credentialForm.get('password')?.value" class="animate-fadeIn"></app-password-requirements>
  </app-natiart-form-field>

  <app-natiart-form-field label="Confirm Password" [isPassword]="true" controlName="confirmPassword" [form]="credentialForm" i18n-label>
    <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" placeholder="••••••••" class="form-input">
  </app-natiart-form-field>

  <app-button type="button" (click)="goToNext()" [disabled]="credentialForm.invalid" [block]="true" color="primary" size="lg" i18n>Next Step →
  </app-button>
</div>
