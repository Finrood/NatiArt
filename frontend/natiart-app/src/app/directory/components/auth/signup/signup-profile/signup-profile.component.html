<div class="space-y-6" [formGroup]="profileForm">
  @if (errorMessage) { <p class="text-error art-panel p-4" role="alert">{{ errorMessage }}</p> }
  <app-profile-form-fields [form]="profileForm"></app-profile-form-fields>
  <div class="grid grid-cols-1 sm:grid-cols-[auto_1fr] gap-3 pt-4">
    <app-button type="button" (click)="goBack()" color="secondary" size="md" i18n>← Back</app-button>
    <app-button type="submit" [disabled]="profileForm.invalid || isSubmitting" color="primary" size="md" [block]="true" i18n>Complete Registration</app-button>
  </div>
</div>
