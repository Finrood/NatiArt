<main class="auth-page bg-background font-sans">
  <div class="auth-grid grid grid-cols-1 lg:grid-cols-2">

    <div class="auth-art hidden lg:flex">
      <div class="auth-artwork"><img src="assets/img/a1.webp" alt="Hand-painted porcelain plate celebrating special moments" i18n-alt></div>
      <p class="auth-art-caption" i18n>Handmade pieces for your home.</p>
    </div>

    <div class="flex items-center justify-center p-4 sm:p-10">
      <div class="w-full max-w-2xl">
        <div class="px-4 mb-8">
          <h1 data-page-heading i18n class="text-3xl font-normal font-serif text-primary-dark">Create Your Account</h1>
        </div>

        <div class="bg-surface p-4 art-panel border border-primary-lighter/20">

          <app-step-indicator [currentStep]="currentStep"></app-step-indicator>

          <form (ngSubmit)="doRegisterUser()" [formGroup]="signupForm" class="mt-8">
            @switch (currentStep) {
              @case (1) { <app-signup-credentials [credentialForm]="credentialsForm" (nextStep)="onNextStep()"></app-signup-credentials> }
              @case (2) { <app-signup-profile [profileForm]="profileForm" [errorMessage]="errorMessage" [isSubmitting]="isSubmitting" (previousStep)="onPreviousStep()" (nextStep)="onNextStep()"></app-signup-profile>
            } }
          </form>
        </div>

        <p class="mt-8 text-center text-sm text-secondary-light">
          <ng-container i18n>Already have an account?
          </ng-container><a routerLink="/login" class="font-semibold text-primary hover:text-primary-dark underline underline-offset-2" i18n>Sign in here</a>
        </p>
      </div>
    </div>
  </div>
</main>
