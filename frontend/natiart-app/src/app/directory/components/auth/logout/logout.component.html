<main class="min-h-screen bg-background flex items-center justify-center px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-8 text-center">
    @if (!loggedOut) {
      <div>
        <h1 class="text-2xl font-semibold text-secondary-dark mb-4" i18n>Logging Out</h1>
        <app-loading-spinner></app-loading-spinner>
        <p class="mt-2 text-secondary-light" i18n>Please wait while we securely log you out.</p>
      </div>
    }
    @if (loggedOut) {
      <div>
        <h1 class="text-2xl font-semibold text-secondary-dark mb-4" i18n>Logged Out</h1>
        <p class="text-secondary-light" i18n>You have been successfully logged out.</p>
      </div>
    }
  </div>
</main>
