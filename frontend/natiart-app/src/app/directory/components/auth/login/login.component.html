<div class="auth-page bg-background font-sans">
  <div class="auth-grid grid grid-cols-1 lg:grid-cols-2">

    <div class="auth-art hidden lg:flex">
      <div class="auth-artwork"><img src="assets/img/a1.webp" alt="Elegant porcelain" i18n-alt></div>
      <p class="auth-art-caption" i18n>Handmade pieces for your home.</p>
    </div>

    <div class="flex items-center justify-center p-4 sm:p-10">
      <div class="w-full max-w-md">


        <div animate.enter="login-fade-in" class="bg-surface p-5 sm:p-8 art-panel border border-primary-lighter/20">
          <h1 data-page-heading class="text-3xl font-normal text-secondary-dark text-center mb-2" i18n>Welcome Back</h1>
          <p class="text-center text-secondary-light mb-8" i18n>Sign in to manage your orders or continue to checkout.</p>

          @if (errorMessage) {
            <div class="bg-error/10 border border-error/30 text-error px-4 py-3 rounded-lg mb-6 text-sm" role="alert">
              {{ errorMessage }}
            </div>
          }

          <form (ngSubmit)="doLoginUser()" [formGroup]="loginForm" class="space-y-6">
            <div formGroupName="credentials">
              <app-natiart-form-field label="Email Address" controlName="username" [form]="credentialsForm" i18n-label>
                <input type="email" formControlName="username" autocomplete="email" placeholder="you@example.com"
                       class="form-input" i18n-placeholder>
              </app-natiart-form-field>

              <app-natiart-form-field label="Password" [isPassword]="true" controlName="password" [form]="credentialsForm" i18n-label>
                <input type="password" formControlName="password" autocomplete="current-password"
                       placeholder="••••••••" class="form-input">
              </app-natiart-form-field>
            </div>

            <div class="text-right -mt-3">
              <a routerLink="/forgot-password" class="text-sm text-primary hover:text-primary-dark underline underline-offset-2" i18n>
                Forgot your password?
              </a>
            </div>

            <app-button type="submit" [disabled]="loginForm.invalid || isSubmitting" [block]="true" color="primary" size="lg" i18n>
              Sign In
            </app-button>
          </form>

        </div>

        <p class="mt-8 text-center text-sm text-secondary-light">
          <ng-container i18n>Not a member?
          </ng-container><a routerLink="/register" class="font-semibold text-primary hover:text-primary-dark underline underline-offset-2" i18n>Sign up now
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
