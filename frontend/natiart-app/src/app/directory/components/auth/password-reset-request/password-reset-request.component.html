<div class="min-h-screen bg-background font-serif flex items-center justify-center p-6">
  <main class="w-full max-w-md bg-surface p-8 rounded-2xl shadow-lg border border-primary-lighter/20">
    <h1 class="text-3xl text-secondary-dark text-center mb-2">Reset your password</h1>
    <p class="text-center text-secondary-light mb-8">Enter your email and we’ll send recovery instructions.</p>

    @if (message) {
      <div class="bg-success/10 border border-success/30 text-success px-4 py-3 rounded-lg mb-6" role="status">
        {{ message }}
      </div>
    }
    @if (errorMessage) {
      <div class="bg-error/10 border border-error/30 text-error px-4 py-3 rounded-lg mb-6" role="alert">
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6" novalidate>
      <app-natiart-form-field label="Email Address" controlName="username" [form]="form">
        <input id="username" type="email" formControlName="username" autocomplete="email"
          placeholder="you@example.com" class="form-input">
      </app-natiart-form-field>
      <app-button type="submit" [disabled]="form.invalid || isSubmitting" [block]="true" color="primary" size="lg">
        Send reset link
      </app-button>
    </form>

    <p class="mt-8 text-center text-sm text-secondary-light">
      <a routerLink="/login" class="font-semibold text-primary hover:text-primary-dark underline underline-offset-2">
        Back to sign in
      </a>
    </p>
  </main>
</div>
