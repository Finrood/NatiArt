<div class="auth-recovery bg-background font-sans flex items-center justify-center p-4 sm:p-6">
  <main class="w-full max-w-md bg-surface p-8 art-panel border border-primary-lighter/20">
    <h1 data-page-heading class="text-3xl text-secondary-dark text-center mb-2" i18n>Reset your password</h1>
    <p class="text-center text-secondary-light mb-8" i18n>Enter your email and we’ll send recovery instructions.</p>

    @if ($message()) {
      <div class="bg-success/10 border border-success/30 text-success px-4 py-3 rounded-lg mb-6" role="status">
        {{ $message() }}
      </div>
    }
    @if ($errorMessage()) {
      <div class="bg-error/10 border border-error/30 text-error px-4 py-3 rounded-lg mb-6" role="alert">
        {{ $errorMessage() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6" novalidate>
      <app-natiart-form-field label="Email Address" controlName="username" [form]="form" i18n-label>
        <input id="username" type="email" formControlName="username" autocomplete="email"
          placeholder="you@example.com" class="form-input" i18n-placeholder>
      </app-natiart-form-field>
      <app-button type="submit" [disabled]="form.invalid || $isSubmitting()" [block]="true" color="primary" size="lg" i18n>
        Send reset link
      </app-button>
    </form>

    <p class="mt-8 text-center text-sm text-secondary-light">
      <a routerLink="/login" class="font-semibold text-primary hover:text-primary-dark underline underline-offset-2" i18n>
        Back to sign in
      </a>
    </p>
  </main>
</div>
