# Priority list of agent CLIs/models for the improvement loop (sourced by run-agent.sh).
# Earlier entries are tried first; on a quota/stall failure the next entry is tried,
# and when the list is exhausted the wrapper loops back to the top until the time
# budget expires. Order = priority, per maintainer decision (2026-09-05):
#   1. opencode + Muse Spark 1.3 free        (free tier, exhaustible)
#   2. cline + DeepSeek V4 Flash (xhigh)     (paid fallback, via the cline gateway)
#   3. cline + GLM-5.3-flash                 (second paid fallback)
#
# Field format per entry (| separated):
#   CLI|label|model_id|thinking_level
#   - cli:           opencode | cline
#   - label:         stable identifier (also exported as NATIART_ACTIVE_MODEL)
#   - model_id:      id as the CLI expects it (opencode: provider/model; cline: gateway id)
#   - thinking_level: cline reasoning effort (none|low|medium|high|xhigh); empty = provider default
PRIORITY=(
  "opencode|opencode-muse|opencode/muse-spark-1.3-contributor-free|"
  "cline|cline-deepseek|deepseek/deepseek-v4-flash|xhigh"
  "cline|cline-glm|zai/glm-5.3-flash|medium"
)