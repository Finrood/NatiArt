# PostgreSQL database configuration
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
# do not execute initialization scripts (schema.sql and data.sql)
spring.sql.init.mode=never
#----------------------------------------------------------------------------------------
# EXTERNAL SERVICES
# Production must declare every upstream endpoint explicitly. The base profile has
# local/sandbox defaults for development, but allowing those defaults here can send
# requests to internal or sandbox endpoints after a deploy misconfiguration.
melhorenvio.api.url=${MELHORENVIO_API_URL}
melhorenvio.api.token=${MELHORENVIO_API_TOKEN}
natiart.payment.asaas.payments-url=${NATIART_PAYMENT_ASAAS_PAYMENTS_URL}
directory.service.url=${DIRECTORY_SERVICE_URL}
directory.service.validation-secret=${DIRECTORY_SERVICE_VALIDATION_SECRET}
#----------------------------------------------------------------------------------------
# STORAGE
nati.storage.upload=file
#----------------------------------------------------------------------------------------
# CORS (production default is prod-only; override per deploy with CORS_ALLOWED_ORIGINS)
nati.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://natiart.samuelpetre.com}
