# Disposable QA: every process starts from the committed seed.
spring.datasource.url=jdbc:h2:mem:natiart-qa-product;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.sql.init.encoding=UTF-8
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:qa-data.sql
spring.jpa.hibernate.ddl-auto=create
natiart.qa.provider-reset-url=${NATIART_QA_PROVIDER_RESET_URL:}
