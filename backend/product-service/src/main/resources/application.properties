spring.application.name=product
server.port=8082
#----------------------------------------------------------------------------------------
# AUTHENTICATION
# JWT validation is delegated to the directory-service; no local JWT secret is needed.
spring.jpa.open-in-view=false
#----------------------------------------------------------------------------------------
# CORS (comma-separated; override per deploy with CORS_ALLOWED_ORIGINS)
nati.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://natiart.samuelpetre.com}
#----------------------------------------------------------------------------------------
# DATABASE INITIALIZATION
# Seed scripts are opt-in: data.sql runs only with the local-h2 profile, never
# on an unprofiled or production boot.
spring.sql.init.mode=never

#----------------------------------------------------------------------------------------
# STORAGE
nati.storage.upload=file
nati.storage.filesystem.allowed-roots=${NATIART_STORAGE_ROOT:${java.io.tmpdir}/product-images},${user.dir}/product-images
nati.storage.filesystem.legacy-roots=${NATIART_STORAGE_LEGACY_ROOTS:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
# Customer artwork is converted to WebP and stored under an opaque server id.
natiart.customer-upload.max-bytes=${NATIART_CUSTOMER_UPLOAD_MAX_BYTES:5000000}
natiart.customer-upload.ttl-hours=${NATIART_CUSTOMER_UPLOAD_TTL_HOURS:24}
natiart.customer-upload.cleanup-delay-millis=${NATIART_CUSTOMER_UPLOAD_CLEANUP_DELAY_MILLIS:3600000}
# Prices are authoritative on the server; deployments may configure this per-unit surcharge.
natiart.order.personalization-surcharge=${NATIART_ORDER_PERSONALIZATION_SURCHARGE:0.00}
#----------------------------------------------------------------------------------------
# PRODUCT SHIPPING
melhorenvio.api.url=${MELHORENVIO_API_URL:https://sandbox.melhorenvio.com.br/api/v2/me/shipment/calculate}
melhorenvio.api.token=${MELHORENVIO_API_TOKEN:}
melhorenvio.api.from-postal-code=${MELHORENVIO_FROM_POSTAL_CODE:88085201}
natiart.shipping.quote-ttl-seconds=${NATIART_SHIPPING_QUOTE_TTL_SECONDS:900}
#----------------------------------------------------------------------------------------
# PRODUCT PAYMENT
natiart.payment.asaas.apikey=${NATIART_PAYMENT_ASAAS_APIKEY}
natiart.payment.asaas.payments-url=${NATIART_PAYMENT_ASAAS_PAYMENTS_URL:https://sandbox.asaas.com/api/v3/payments}

directory.service.url=${DIRECTORY_SERVICE_URL:http://localhost:8081}
directory.service.validation-secret=${DIRECTORY_SERVICE_VALIDATION_SECRET:}
directory.service.auth-cache.ttl-millis=${DIRECTORY_SERVICE_AUTH_CACHE_TTL_MILLIS:30000}
directory.service.auth-cache.max-entries=${DIRECTORY_SERVICE_AUTH_CACHE_MAX_ENTRIES:10000}
directory.service.auth-cache.cleanup-delay-millis=${DIRECTORY_SERVICE_AUTH_CACHE_CLEANUP_DELAY_MILLIS:60000}
natiart.auth-cache.invalidation-secret=${NATIART_AUTH_CACHE_INVALIDATION_SECRET:}

#----------------------------------------------------------------------------------------
# ANONYMOUS SHIPPING RATE LIMIT
nati.security.rate-limit.max-requests-per-minute=${NATI_SECURITY_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:10}
nati.security.rate-limit.trusted-proxies=${NATI_SECURITY_RATE_LIMIT_TRUSTED_PROXIES:}
nati.security.rate-limit.cleanup-delay-millis=${NATI_SECURITY_RATE_LIMIT_CLEANUP_DELAY_MILLIS:60000}

#----------------------------------------------------------------------------------------
# ORDER / PAYMENT RESERVATION LIFECYCLE
natiart.payment.idempotency.stale-reservation-millis=${NATIART_PAYMENT_IDEMPOTENCY_STALE_RESERVATION_MILLIS:900000}
natiart.payment.idempotency.recovery-delay-millis=${NATIART_PAYMENT_IDEMPOTENCY_RECOVERY_DELAY_MILLIS:60000}
natiart.order.max-outstanding-reservations=${NATIART_ORDER_MAX_OUTSTANDING_RESERVATIONS:5}
natiart.order.reservation.ttl-millis=${NATIART_ORDER_RESERVATION_TTL_MILLIS:1800000}
natiart.order.reservation.reaper-delay-millis=${NATIART_ORDER_RESERVATION_REAPER_DELAY_MILLIS:60000}

#----------------------------------------------------------------------------------------
# HTTP COMPRESSION
server.compression.enabled=true
server.compression.min-response-size=2048
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
