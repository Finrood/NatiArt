# PostgreSQL database configuration
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
# Retain the existing mode until the complete agreed migration history is rehearsed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
# do not execute initialization scripts (schema.sql and data.sql)
spring.sql.init.mode=never
saas.security.internal.validation-secret=${DIRECTORY_SERVICE_VALIDATION_SECRET}
saas.security.rate-limit.internal-validation-max-requests-per-minute=${SAAS_SECURITY_RATE_LIMIT_INTERNAL_VALIDATION_MAX_REQUESTS_PER_MINUTE:600}
#----------------------------------------------------------------------------------------
# EXTERNAL SERVICES
# Require the production Asaas endpoint explicitly; the base profile's sandbox
# default is intentionally limited to local development.
natiart.payment.asaas.customers-url=${NATIART_PAYMENT_ASAAS_CUSTOMERS_URL}
# Reset links are delivered through the configured notification adapter.
saas.security.password-reset.frontend-url=${SAAS_SECURITY_PASSWORD_RESET_FRONTEND_URL}
natiart.product-service.url=${PRODUCT_SERVICE_URL}
natiart.auth-cache.invalidation-secret=${NATIART_AUTH_CACHE_INVALIDATION_SECRET}
#----------------------------------------------------------------------------------------
# CORS (production default is prod-only; override per deploy with CORS_ALLOWED_ORIGINS)
nati.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://natiart.samuelpetre.com}
#----------------------------------------------------------------------------------------
