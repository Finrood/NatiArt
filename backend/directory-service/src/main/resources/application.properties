spring.application.name=directory
server.port=8081
#----------------------------------------------------------------------------------------
# AUTHENTICATION
# =============================================================================================
# JWT Token Configuration
# Access Token expiration time in milliseconds (here, 24 hours)
# Refresh Token expiration time in milliseconds (here, 7 days)
# =============================================================================================
saas.security.jwt.key.secret=${SAAS_SECURITY_JWT_KEY_SECRET:}
saas.security.jwt.expiration=86400000
saas.security.jwt.refresh.expiration=604800000

spring.jpa.open-in-view=false

#----------------------------------------------------------------------------------------
# CORS (comma-separated; override per deploy with CORS_ALLOWED_ORIGINS)
nati.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://natiart.samuelpetre.com}

# Shared database-backed fixed-window limiter. Forwarded client addresses are
# used only when the immediate peer is listed as a trusted proxy.
saas.security.rate-limit.max-requests-per-minute=${SAAS_SECURITY_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:10}
saas.security.rate-limit.trusted-proxies=${SAAS_SECURITY_RATE_LIMIT_TRUSTED_PROXIES:}
saas.security.rate-limit.cleanup-delay-millis=${SAAS_SECURITY_RATE_LIMIT_CLEANUP_DELAY_MILLIS:60000}

#----------------------------------------------------------------------------------------
# DATABASE INITIALIZATION
# Seed scripts are opt-in: data.sql runs only with the local-h2 profile, never
# on an unprofiled or production boot.
spring.sql.init.mode=never

#----------------------------------------------------------------------------------------
# PRODUCT PAYMENT
natiart.payment.asaas.apikey=${NATIART_PAYMENT_ASAAS_APIKEY}
natiart.payment.asaas.customers-url=${NATIART_PAYMENT_ASAAS_CUSTOMERS_URL:https://sandbox.asaas.com/api/v3/customers}

#----------------------------------------------------------------------------------------
# HTTP COMPRESSION
server.compression.enabled=true
server.compression.min-response-size=2048
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
