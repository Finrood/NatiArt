spring.application.name=directory
server.port=8081
#----------------------------------------------------------------------------------------
# AUTHENTICATION
# =============================================================================================
# JWT Token Configuration
# Access Token expiration time in milliseconds (here, 2 minutes)
# Refresh Token expiration time in milliseconds (here, 7 days)
# =============================================================================================
saas.security.jwt.key.secret=${SAAS_SECURITY_JWT_KEY_SECRET:}
saas.security.jwt.expiration=86400000
saas.security.jwt.refresh.expiration=604800000

spring.jpa.open-in-view=false

#----------------------------------------------------------------------------------------
# PRODUCT PAYMENT
natiart.payment.asaas.apikey=${NATIART_PAYMENT_ASAAS_APIKEY}
natiart.payment.asaas.customers-url=${NATIART_PAYMENT_ASAAS_CUSTOMERS_URL:https://sandbox.asaas.com/api/v3/customers}

#----------------------------------------------------------------------------------------
# HTTP COMPRESSION
server.compression.enabled=true
server.compression.min-response-size=2048
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
