# Disposable QA: every process starts from the committed seed.
spring.datasource.url=jdbc:h2:mem:natiart-qa-directory;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.sql.init.encoding=UTF-8
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:qa-data.sql
spring.jpa.hibernate.ddl-auto=create
natiart.qa.provider-reset-url=${NATIART_QA_PROVIDER_RESET_URL:}
natiart.qa.notifications-url=${NATIART_QA_NOTIFICATIONS_URL:}
natiart.qa.control-token=${NATIART_QA_CONTROL_TOKEN:}
# Allow rapid account switching in QA; override to rehearse normal throttling.
saas.security.rate-limit.max-requests-per-minute=${SAAS_SECURITY_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:100}
